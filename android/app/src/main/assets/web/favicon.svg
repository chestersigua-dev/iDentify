<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <radialGradient id="sensorGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="1.5" flood-color="#22d3ee" flood-opacity="0.7" />
    </filter>
  </defs>

  <!-- Background Plate -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2.5" />
  
  <!-- Subtle Sensor Glow -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sensorGlow)" />

  <!-- Corner Brackets -->
  <path d="M12 20V12H20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 20V12H44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M12 44V52H20" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M52 44V52H44" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Horizontal Laser Scanline -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="#22d3ee" stroke-width="1.8" stroke-opacity="0.85" />
  <line x1="22" y1="32" x2="42" y2="32" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" />

  <!-- Biometric Thumbprint / Fingerprint Ridges -->
  <g transform="translate(16, 16) scale(1.333)" stroke-linecap="round" stroke-linejoin="round" filter="url(#cyanGlow)">
    <path d="M2 12C2 6.5 6.5 2 12 2a10 10 0 0 1 8 4" stroke="#22d3ee" stroke-width="2.2" />
    <path d="M5 19.5C5.5 18 6 15 6 12c0-.7.12-1.37.34-2" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M17.29 21.02c.12-.6.43-2.3.5-3.02" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M12 10a2 2 0 0 0-2 2c0 1.02-.1 2.51-.26 4" stroke="#e0f2fe" stroke-width="2.2" />
    <path d="M8.65 22c.21-.66.45-1.32.57-2" stroke="#22d3ee" stroke-width="2.2" />
    <path d="M14 13.12c0 2.38 0 6.38-1 8.88" stroke="#67e8f9" stroke-width="2.2" />
    <path d="M2 16h.01" stroke="#22d3ee" stroke-width="2.5" />
    <path d="M21.8 16c.2-2 .131-5.354 0-6" stroke="#38bdf8" stroke-width="2.2" />
    <path d="M9 6.8a6 6 0 0 1 9 5.2c0 .47 0 1.17-.02 2" stroke="#67e8f9" stroke-width="2.2" />
  </g>
</svg>
