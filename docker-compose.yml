services:
  postgres:
    image: postgres:16-alpine
    container_name: identify-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-identify_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-identify_secure_pass_2026}
      POSTGRES_DB: ${DB_NAME:-identify_saas_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-identify_user} -d ${DB_NAME:-identify_saas_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - identify-network

  redis:
    image: redis:7-alpine
    container_name: identify-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - identify-network

  minio:
    image: minio/minio:RELEASE.2024-01-31T20-20-33Z
    container_name: identify-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minio_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minio_secure_pass_2026}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    networks:
      - identify-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: identify-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-4000}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${DB_USER:-identify_user}
      DB_PASSWORD: ${DB_PASSWORD:-identify_secure_pass_2026}
      DB_NAME: ${DB_NAME:-identify_saas_db}
      DATABASE_URL: postgresql://${DB_USER:-identify_user}:${DB_PASSWORD:-identify_secure_pass_2026}@postgres:5432/${DB_NAME:-identify_saas_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-default_jwt_secret_identify_2026}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-default_jwt_refresh_secret_2026}
      HMAC_AUDIT_SALT: ${HMAC_AUDIT_SALT:-default_hmac_audit_salt_2026}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-default_encryption_key_32_bytes_2026}
      SMS_PROVIDER: ${SMS_PROVIDER:-MOCK}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-mock_key}
      PHILSMS_API_TOKEN: ${PHILSMS_API_TOKEN:-mock_token}
    ports:
      - "${PORT:-4000}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - identify-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: identify-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${FRONTEND_PORT:-3000}
      NEXT_PUBLIC_API_URL: http://localhost:${PORT:-4000}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      - backend
    networks:
      - identify-network

volumes:
  pg_data:
    name: identify_pg_data
  redis_data:
    name: identify_redis_data
  minio_data:
    name: identify_minio_data

networks:
  identify-network:
    name: identify_network
    driver: bridge
